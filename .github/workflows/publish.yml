name: Publish
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Verify version and package
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json"); if (`v${p.version}` !== process.env.GITHUB_REF_NAME || p.name !== "n8n-nodes-qireader" || l.name !== p.name || l.version !== p.version) process.exit(1)'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Pack
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/n8n-nodes-qireader-*.tgz
      - name: Publish
        run: npm publish "$RUNNER_TEMP/n8n-nodes-qireader-${GITHUB_REF_NAME#v}.tgz" --registry https://registry.npmjs.org/ --access public --tag latest --provenance --ignore-scripts
